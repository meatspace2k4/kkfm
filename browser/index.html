<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aircheck</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b0b0f;color:#f5f5f5;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:1.5rem;}
button{padding:15px 30px;font-size:1.2rem;border-radius:8px;border:0;cursor:pointer;background:#3b82f6;color:white;transition:background .2s;}
button:hover{background:#2563eb;}
button:disabled{background:#4b5563;cursor:not-allowed;}
.status{margin-top:1rem;color:#9ca3af;font-size:.9rem;}
</style>
<!-- Resolves the Embedded App SDK for browser/discord-shell.js. Points at a
     same-origin vendored copy so nothing loads from an external CDN inside the
     Discord iframe. Download it once on the Pi (see browser/README-discord.md):
       mkdir -p browser/vendor
       curl -L "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@2/+esm" \
         -o browser/vendor/embedded-app-sdk.js -->
<script type="importmap">
{
  "imports": {
    "@discord/embedded-app-sdk": "/vendor/embedded-app-sdk.js"
  }
}
</script>
</head>
<body>
<h1>Aircheck</h1>
<button id="playBtn">▶ Start Radio</button>
<div id="status" class="status">Ready</div>
<script type="module">
import { initDiscordShell, isInsideDiscord } from './discord-shell.js';

const workletCode = `
class PCMProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.current = null;
    this.offset = 0;
    this.queue = [];
    this.port.onmessage = (event) => {
      if (event.data) this.queue.push(event.data);
    };
  }
  process(inputs, outputs) {
    const left = outputs[0][0];
    const right = outputs[0][1];
    for (let i = 0; i < left.length; i++) {
      if (!this.current || this.offset >= this.current.length) {
        if (this.queue.length === 0) {
          left[i] = 0;
          right[i] = 0;
          continue;
        }
        this.current = this.queue.shift();
        this.offset = 0;
      }
      left[i] = this.current[this.offset++];
      right[i] = this.current[this.offset++];
    }
    return true;
  }
}
registerProcessor('pcm-processor', PCMProcessor);
`;

const btn = document.getElementById('playBtn');
const status = document.getElementById('status');

async function startAudio() {
  if (btn.disabled) return;
  btn.disabled = true;
  btn.innerText = 'Connecting...';
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    
    let pcmNode;
    if (audioCtx.audioWorklet) {
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
        const workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor', { outputChannelCount: [2] });
        workletNode.connect(audioCtx.destination);
        pcmNode = workletNode;
    } else {
        console.warn('AudioWorklet not available, falling back to ScriptProcessorNode');
        const scriptNode = audioCtx.createScriptProcessor(4096, 0, 2);
        const queue = [];
        let current = null;
        let offset = 0;
        
        scriptNode.onaudioprocess = (e) => {
            const left = e.outputBuffer.getChannelData(0);
            const right = e.outputBuffer.getChannelData(1);
            const len = left.length;
            for (let i = 0; i < len; i++) {
                if (!current || offset >= current.length) {
                    if (queue.length === 0) {
                        left[i] = 0;
                        right[i] = 0;
                        continue;
                    }
                    current = queue.shift();
                    offset = 0;
                }
                left[i] = current[offset++];
                right[i] = current[offset++];
            }
        };
        scriptNode.connect(audioCtx.destination);
        pcmNode = {
            port: {
                postMessage: (data) => {
                    queue.push(data);
                }
            }
        };
    }

    const response = await fetch('/stream');
    if (!response.body) throw new Error('ReadableStream unsupported');
    const reader = response.body.getReader();
    status.innerText = 'Streaming…';
    btn.innerText = 'Live';

    let headerBytesRemaining = 44;
    // Carry-over for bytes that don't complete a 4-byte stereo frame. Network
    // reads land on arbitrary byte boundaries; dropping the remainder (as the
    // old code did) byte-shifts every later sample and plays as loud static.
    let leftover = new Uint8Array(0);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (!value || value.byteLength === 0) continue;

      let chunk = value;
      if (headerBytesRemaining > 0) {
        if (chunk.byteLength <= headerBytesRemaining) {
          headerBytesRemaining -= chunk.byteLength;
          continue;
        }
        chunk = chunk.subarray(headerBytesRemaining);
        headerBytesRemaining = 0;
      }

      let buf = chunk;
      if (leftover.length > 0) {
        buf = new Uint8Array(leftover.length + chunk.byteLength);
        buf.set(leftover, 0);
        buf.set(chunk, leftover.length);
      }

      const usableBytes = buf.byteLength & ~3;
      leftover = buf.slice(usableBytes);
      if (usableBytes === 0) continue;

      // DataView: safe at any byteOffset, explicit little-endian (WAV PCM).
      const view = new DataView(buf.buffer, buf.byteOffset, usableBytes);
      const sampleCount = usableBytes >> 1;
      const floatChunk = new Float32Array(sampleCount);
      for (let i = 0; i < sampleCount; i++) {
        floatChunk[i] = view.getInt16(i * 2, true) / 32768.0;
      }
      pcmNode.port.postMessage(floatChunk, [floatChunk.buffer]);
    }
  } catch (err) {
    console.error(err);
    status.innerText = 'Error: ' + err.message;
    btn.disabled = false;
    btn.innerText = '▶ Retry';
  }
}

// The click doubles as the user gesture that lets AudioContext start.
btn.addEventListener('click', startAudio);

// When launched as a Discord Activity, complete the SDK/OAuth handshake up
// front. Outside Discord this is skipped and the page behaves as before.
if (isInsideDiscord()) {
  status.innerText = 'Connecting to Discord…';
  initDiscordShell()
    .then(() => { status.innerText = 'In voice channel — press play'; })
    .catch((err) => {
      console.error(err);
      status.innerText = 'Discord error: ' + err.message;
    });
}
</script>
</body>
</html>
