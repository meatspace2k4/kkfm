<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KKFM</title>
<style>
/* Palette + grid treatment adapted from jasonflorentino/acnh-jukebox (MIT). */
:root {
  --blue-main: #59d1f4;
  --blue-accent: #03aeb5;
  --blue-dark: #475795;
  --yellow-dark: #fcc409;
  --yellow-light: #f7fd4d;
  --cream: #f4f6e0;
  --brown: #8b7762;
}
* { box-sizing: border-box; }
body {
  font-family: ui-rounded, "Hiragino Maru Gothic ProN", Quicksand, "Comic Sans MS",
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  min-height: 100vh;
  background-color: var(--blue-main);
  /* dotted "menu paper" texture like the in-game UI */
  background-image: radial-gradient(rgba(255,255,255,.14) 12%, transparent 13%),
                    radial-gradient(rgba(255,255,255,.14) 12%, transparent 13%);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
  color: var(--blue-dark);
}
header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: .9rem;
  padding: .7rem 1rem;
  background: var(--cream);
  border-bottom: 4px solid rgba(71,87,149,.15);
  box-shadow: 0 3px 8px rgba(0,0,20,.15);
}
#playBtn {
  flex: none;
  width: 3.2rem;
  height: 3.2rem;
  border-radius: 50%;
  border: 0;
  cursor: pointer;
  font-size: 1.15rem;
  background: var(--yellow-dark);
  color: var(--brown);
  box-shadow: 0 2px 0 rgba(0,0,20,.2);
  transition: transform .15s, background .2s;
}
#playBtn:hover:not(:disabled) { transform: scale(1.06); }
#playBtn:disabled { background: #c9c4ae; cursor: not-allowed; }
.titles { min-width: 0; }
.station {
  font-size: .72rem;
  letter-spacing: .12em;
  font-weight: 700;
  color: var(--blue-accent);
  text-transform: uppercase;
}
#nowTitle {
  font-size: 1.15rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#status {
  margin-left: auto;
  flex: none;
  font-size: .78rem;
  color: var(--brown);
  text-align: right;
}
main { padding: 1rem; max-width: 1440px; margin: 0 auto; }
#grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
}
#grid li {
  width: 50%;
  padding: .5rem;
  position: relative;
}
@media (min-width: 650px)  { #grid li { width: 33.333%; padding: .75rem; } }
@media (min-width: 1080px) { #grid li { width: 25%; } }
.art {
  position: relative;
  border-radius: .5rem;
  transition: box-shadow .25s, transform .25s;
}
.art img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: .5rem;
  background: rgba(71,87,149,.8); /* placeholder while loading */
}
.name {
  margin-top: .35rem;
  text-align: center;
  font-size: .82rem;
  font-weight: 700;
  color: var(--blue-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
li.playing .art {
  box-shadow: 0 0 0 .4rem var(--yellow-light), 0 4px 14px rgba(0,0,20,.35);
  transform: scale(1.03);
}
li.playing .badge {
  position: absolute;
  top: -1px;
  left: -1px;
  width: 2.9rem;
  height: 2.1rem;
  background: var(--yellow-light);
  border-radius: .5rem 0 75% 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--yellow-dark);
  font-size: 1rem;
  z-index: 10;
}
.badge { display: none; }
li.playing .badge { display: flex; }
#phaseBanner {
  display: none;
  margin: 0 auto 1rem;
  max-width: 28rem;
  padding: .8rem 1.2rem;
  background: var(--cream);
  border-radius: 1.2rem;
  text-align: center;
  font-weight: 700;
  box-shadow: 0 3px 8px rgba(0,0,20,.18);
}
#phaseBanner.visible { display: block; }
</style>
<!-- Same-origin vendored Embedded App SDK; see browser/README-discord.md. -->
<script type="importmap">
{
  "imports": {
    "@discord/embedded-app-sdk": "/vendor/embedded-app-sdk.js"
  }
}
</script>
</head>
<body>
<header>
  <button id="playBtn">▶</button>
  <div class="titles">
    <div class="station">KKFM · now playing</div>
    <div id="nowTitle">—</div>
  </div>
  <div id="status">Ready</div>
</header>
<main>
  <div id="phaseBanner"></div>
  <ul id="grid"></ul>
</main>
<script type="module">
import { initDiscordShell, isInsideDiscord } from './discord-shell.js';

// ── PCM streaming (identical logic to index.html — the proven path) ─────────
const workletCode = `
class PCMProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.current = null;
    this.offset = 0;
    this.queue = [];
    this.port.onmessage = (event) => {
      if (event.data) this.queue.push(event.data);
    };
  }
  process(inputs, outputs) {
    const left = outputs[0][0];
    const right = outputs[0][1];
    for (let i = 0; i < left.length; i++) {
      if (!this.current || this.offset >= this.current.length) {
        if (this.queue.length === 0) {
          left[i] = 0;
          right[i] = 0;
          continue;
        }
        this.current = this.queue.shift();
        this.offset = 0;
      }
      left[i] = this.current[this.offset++];
      right[i] = this.current[this.offset++];
    }
    return true;
  }
}
registerProcessor('pcm-processor', PCMProcessor);
`;

const btn = document.getElementById('playBtn');
const status = document.getElementById('status');

async function startAudio() {
  if (btn.disabled) return;
  btn.disabled = true;
  btn.innerText = '…';
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });

    let pcmNode;
    if (audioCtx.audioWorklet) {
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
        const workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor', { outputChannelCount: [2] });
        workletNode.connect(audioCtx.destination);
        pcmNode = workletNode;
    } else {
        console.warn('AudioWorklet not available, falling back to ScriptProcessorNode');
        const scriptNode = audioCtx.createScriptProcessor(4096, 0, 2);
        const queue = [];
        let current = null;
        let offset = 0;

        scriptNode.onaudioprocess = (e) => {
            const left = e.outputBuffer.getChannelData(0);
            const right = e.outputBuffer.getChannelData(1);
            const len = left.length;
            for (let i = 0; i < len; i++) {
                if (!current || offset >= current.length) {
                    if (queue.length === 0) {
                        left[i] = 0;
                        right[i] = 0;
                        continue;
                    }
                    current = queue.shift();
                    offset = 0;
                }
                left[i] = current[offset++];
                right[i] = current[offset++];
            }
        };
        scriptNode.connect(audioCtx.destination);
        pcmNode = {
            port: {
                postMessage: (data) => {
                    queue.push(data);
                }
            }
        };
    }

    const response = await fetch('/stream');
    if (!response.body) throw new Error('ReadableStream unsupported');
    const reader = response.body.getReader();
    status.innerText = 'Live';
    btn.innerText = '♪';

    let headerBytesRemaining = 44;
    // Carry-over for bytes that don't complete a 4-byte stereo frame (see
    // index.html for why dropping the remainder plays as static).
    let leftover = new Uint8Array(0);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (!value || value.byteLength === 0) continue;

      let chunk = value;
      if (headerBytesRemaining > 0) {
        if (chunk.byteLength <= headerBytesRemaining) {
          headerBytesRemaining -= chunk.byteLength;
          continue;
        }
        chunk = chunk.subarray(headerBytesRemaining);
        headerBytesRemaining = 0;
      }

      let buf = chunk;
      if (leftover.length > 0) {
        buf = new Uint8Array(leftover.length + chunk.byteLength);
        buf.set(leftover, 0);
        buf.set(chunk, leftover.length);
      }

      const usableBytes = buf.byteLength & ~3;
      leftover = buf.slice(usableBytes);
      if (usableBytes === 0) continue;

      const view = new DataView(buf.buffer, buf.byteOffset, usableBytes);
      const sampleCount = usableBytes >> 1;
      const floatChunk = new Float32Array(sampleCount);
      for (let i = 0; i < sampleCount; i++) {
        floatChunk[i] = view.getInt16(i * 2, true) / 32768.0;
      }
      pcmNode.port.postMessage(floatChunk, [floatChunk.buffer]);
    }
    status.innerText = 'Stream ended';
    btn.disabled = false;
    btn.innerText = '▶';
  } catch (err) {
    console.error(err);
    status.innerText = 'Error: ' + err.message;
    btn.disabled = false;
    btn.innerText = '▶';
  }
}

btn.addEventListener('click', startAudio);

// ── Jacket grid ──────────────────────────────────────────────────────────────
const grid = document.getElementById('grid');
const nowTitle = document.getElementById('nowTitle');
const phaseBanner = document.getElementById('phaseBanner');

// Fold typographic apostrophes so "K.K. Cruisin’" (game strings) matches
// "K.K. Cruisin'" (dataset strings) regardless of which side uses which.
const norm = (s) => (s || '').replace(/’/g, "'").trim().toLowerCase();

let tilesByTitle = new Map();

async function buildGrid() {
  const resp = await fetch('/songs.json');
  const { songs } = await resp.json();
  for (const song of songs) {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="art">
        <div class="badge">▶</div>
        <img loading="lazy" src="/jackets/${song.file}.png" alt="">
      </div>
      <div class="name"></div>`;
    li.querySelector('img').alt = song.title;
    li.querySelector('.name').textContent = song.title;
    grid.appendChild(li);
    tilesByTitle.set(norm(song.title), li);
  }
}

// ── Now-playing poller ───────────────────────────────────────────────────────
const PHASE_LABELS = {
  jingle: '♬ Station jingle…',
  commercial: '📻 Commercial break…',
  mc: '🎙 K.K. on the mic…',
};

let currentTile = null;

function applyNowPlaying(info) {
  const title = info && info.title ? info.title : null;
  const phase = info && info.phase ? info.phase : 'music';

  nowTitle.textContent = title || '—';

  if (phase !== 'music' && PHASE_LABELS[phase]) {
    phaseBanner.textContent = PHASE_LABELS[phase];
    phaseBanner.classList.add('visible');
  } else {
    phaseBanner.classList.remove('visible');
  }

  const tile = title ? tilesByTitle.get(norm(title)) : null;
  if (tile === currentTile) return;
  if (currentTile) currentTile.classList.remove('playing');
  currentTile = tile || null;
  if (currentTile) {
    currentTile.classList.add('playing');
    currentTile.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

async function pollNowPlaying() {
  try {
    const resp = await fetch('/nowplaying.json', { cache: 'no-store' });
    if (resp.ok) applyNowPlaying(await resp.json());
  } catch (_) { /* transient — keep last state */ }
}

buildGrid().then(() => {
  pollNowPlaying();
  setInterval(pollNowPlaying, 3000);
});

// ── Discord Activity handshake (identical to index.html) ────────────────────
if (isInsideDiscord()) {
  status.innerText = 'Connecting to Discord…';
  initDiscordShell()
    .then(() => { status.innerText = 'In voice — press play'; })
    .catch((err) => {
      console.error(err);
      status.innerText = 'Discord error: ' + err.message;
    });
}
</script>
</body>
</html>
