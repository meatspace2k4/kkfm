# /etc/systemd/system/acnh-hourly-watchdog.service.d/out-dir.conf
# Anomalies go next to the radio watchdog's (watchdog/out), readable by jpark;
# /mnt/kkfm-usb is svc-home only.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'journalctl -u acnh-hourly.service -f -n 0 -o cat | /usr/bin/env python3 /mnt/kkfm-usb/kkfm/hourly-build/watchdog_run.py monitor-logs --stdin --unit acnh-hourly.service --out-dir /home/jpark/Aircheck/kkfm/watchdog/out-hourly'
