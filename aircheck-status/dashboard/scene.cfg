# aircheck-status scene definition. Coordinates are character
# cells, x cols rightward, y rows downward, z INTO the screen. The camera is
# frozen orthographic identity; drag rotates the assembly.

ch      9 19          # px per char cell, w h (Menlo, as the source)
canvas  100 28        # the dashboard's terminal, 100x28
depth   0.10          # z px per mm (unused: no depth region on this TUI)
fov     45            # unused here; the format requires it, fail-loud parser
trail   36            # unused here; same

grid    0 99 6        # depth region parked off-grid: row 99 > ROWS, so every
                      # cell is the glass and the interface renders flat until
                      # rotated. No bars on this TUI.
