# /etc/systemd/system/sonos-smapi.service.d/priority.conf
# The relay and its ffmpeg encoders feed Sonos in real time; they yield only to the players (FIFO 50).
[Service]
IOSchedulingClass=realtime
# svc-smapi cannot raise itself to realtime; systemd sets it and the ffmpeg children inherit it
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=40
LimitRTPRIO=95
