# /etc/systemd/system/acnh-aircheck.service.d/priority.conf
# Audio first: encoders and other services yield to the players.
[Service]
Nice=-10
IOSchedulingClass=realtime
# svc-kkfm cannot raise its own threads to realtime; systemd sets it before dropping to the account
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=50
LimitRTPRIO=95
